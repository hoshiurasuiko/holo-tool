<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ホロスコープ AI精密プロンプト生成ツール</title>
  <!-- NASA JPL基準の天文学計算ライブラリ (jsdelivr CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
  <style>
    :root {
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --primary: #1e3a8a;
      --primary-hover: #172554;
      --accent: #2563eb;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", "Noto Sans CJK JP", sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 1.5rem 1rem;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 820px;
      background: var(--card-bg);
      padding: 1.8rem;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.06);
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      color: var(--primary);
    }
    p.desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
    }
    .section-title {
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.8rem;
      border-left: 4px solid var(--primary);
      padding-left: 0.6rem;
      color: var(--primary);
    }
    .input-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      gap: 1rem;
      margin-bottom: 1.2rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      color: #334155;
    }
    .select-group {
      display: flex;
      gap: 0.35rem;
      align-items: center;
    }
    select {
      padding: 0.55rem 0.4rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.9rem;
      outline: none;
      background: #fff;
      color: var(--text);
      flex: 1;
    }
    select:focus {
      border-color: var(--accent);
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
      cursor: pointer;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 0.8rem;
      background-color: var(--primary);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 1rem;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: var(--primary-hover);
    }
    .result-wrapper {
      margin-top: 2rem;
      display: none;
    }
    .chart-box {
      text-align: center;
      margin-bottom: 1.8rem;
    }
    canvas {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
    }
    .tables-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.2rem;
      margin-bottom: 1.8rem;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    table.data-table th, table.data-table td {
      border-bottom: 1px solid #e2e8f0;
      padding: 0.45rem 0.6rem;
      text-align: left;
    }
    table.data-table th {
      background: #f1f5f9;
      color: #334155;
      font-weight: 600;
    }
    .elem-box {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 0.9rem;
      margin-bottom: 1.8rem;
      font-size: 0.85rem;
    }
    .elem-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.6rem;
      margin-top: 0.5rem;
    }
    .output-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }
    .copy-btn {
      padding: 0.4rem 0.9rem;
      font-size: 0.82rem;
      background-color: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    .copy-btn:hover {
      background-color: var(--primary);
    }
    textarea {
      width: 100%;
      height: 300px;
      padding: 0.85rem;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: #f8fafc;
      color: #1e293b;
      resize: vertical;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>ホロスコープ 精密計算 ＆ AIプロンプト生成</h1>
    <p class="desc">天文暦（視黄経・歳差補正済・プラシーダスハウス）に基づく正確なネイタルチャートとAI解析プロンプトを生成します。</p>

    <div class="section-title">出生データの入力</div>

    <div class="input-grid">
      <div class="form-group">
        <label>生年月日</label>
        <div class="select-group">

          <select id="birthMonth"></select><span style="font-size: 0.8rem;">月</span>
          <select id="birthDay"></select><span style="font-size: 0.8rem;">日</span>
        </div>
      </div>

      <div class="form-group">
        <label>出生時間</label>
        <div class="select-group">
          <select id="birthHour"></select><span style="font-size: 0.8rem;">時</span>
          <select id="birthMinute"></select><span style="font-size: 0.8rem;">分</span>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="timeUnknown" onchange="toggleTimeUnknown(this)"> 時間不明（12:00・ハウスなし）
        </label>
      </div>

      <div class="form-group">
        <label for="prefecture">出生地（都道府県）</label>
        <select id="prefecture"></select>
      </div>
    </div>

    <button class="btn" onclick="executeHoroscope()">ホロスコープ作成 ＆ プロンプト生成</button>

    <div class="result-wrapper" id="resultWrapper">
      <div class="chart-box">
        <div class="section-title" style="text-align: left;">ネイタルチャート（ホロスコープ円盤）</div>
        <canvas id="horoCanvas" width="600" height="600"></canvas>
      </div>

      <div class="elem-box" id="elementBox"></div>

      <div class="tables-grid">
        <div>
          <div class="section-title">天体位置（サイン・度数・ハウス）</div>
          <table class="data-table">
            <thead>
              <tr><th>天体</th><th>サイン</th><th>度数</th><th>ハウス</th></tr>
            </thead>
            <tbody id="planetTableBody"></tbody>
          </table>
        </div>
        <div>
          <div class="section-title">ハウス・カスプ（プラシーダス）</div>
          <table class="data-table">
            <thead>
              <tr><th>ハウス</th><th>サイン</th><th>度数</th></tr>
            </thead>
            <tbody id="houseTableBody"></tbody>
          </table>
        </div>
      </div>

      <div class="output-header">
        <div class="section-title" style="margin-bottom: 0;">AI解析用プロンプト（精密データ埋込済）</div>
        <button class="copy-btn" onclick="copyPrompt()">プロンプトをコピー</button>
      </div>
      <textarea id="promptText" readonly></textarea>
    </div>
  </div>

  <script>
    const PREFECTURES = [

      { name: "島根県 (松江)", lat: 35.472, lng: 133.051 },
      { name: "岡山県 (岡山市)", lat: 34.662, lng: 133.935 },
      { name: "広島県", lat: 34.396, lng: 132.459 },
      { name: "山口県", lat: 34.186, lng: 131.471 },
      { name: "徳島県", lat: 34.066, lng: 134.559 },
      { name: "香川県 (高松)", lat: 34.340, lng: 134.043 },
      { name: "愛媛県 (松山)", lat: 33.842, lng: 132.766 },
      { name: "高知県", lat: 33.560, lng: 133.531 },
      { name: "福岡県", lat: 33.606, lng: 130.418 },
      { name: "佐賀県", lat: 33.249, lng: 130.299 },
      { name: "長崎県", lat: 32.745, lng: 129.874 },
      { name: "熊本県", lat: 32.790, lng: 130.742 },
      { name: "大分県", lat: 33.238, lng: 131.613 },
      { name: "宮崎県", lat: 31.911, lng: 131.424 },
      { name: "鹿児島県", lat: 31.560, lng: 130.558 },
      { name: "沖縄県 (那覇)", lat: 26.213, lng: 127.681 }
    ];

    const ZODIAC = [
      { name: "牡羊座", symbol: "♈", elem: "火", qual: "活動" },
      { name: "牡牛座", symbol: "♉", elem: "地", qual: "固定" },
      { name: "双子座", symbol: "♊", elem: "風", qual: "柔軟" },
      { name: "蟹座",   symbol: "♋", elem: "水", qual: "活動" },
      { name: "獅子座", symbol: "♌", elem: "火", qual: "固定" },
      { name: "乙女座", symbol: "♍", elem: "地", qual: "柔軟" },
      { name: "天秤座", symbol: "♎", elem: "風", qual: "活動" },
      { name: "蠍座",   symbol: "♏", elem: "水", qual: "固定" },
      { name: "射手座", symbol: "♐", elem: "火", qual: "柔軟" },
      { name: "山羊座", symbol: "♑", elem: "地", qual: "活動" },
      { name: "水瓶座", symbol: "♒", elem: "風", qual: "固定" },
      { name: "魚座",   symbol: "♓", elem: "水", qual: "柔軟" }
    ];

    const PLANET_LIST = [
      { id: "Sun",     name: "太陽",   symbol: "☉", color: "#d97706" },
      { id: "Moon",    name: "月",     symbol: "☽", color: "#475569" },
      { id: "Mercury", name: "水星",   symbol: "☿", color: "#0891b2" },
      { id: "Venus",   name: "金星",   symbol: "♀", color: "#db2777" },
      { id: "Mars",    name: "火星",   symbol: "♂", color: "#dc2626" },
      { id: "Jupiter", name: "木星",   symbol: "♃", color: "#7c3aed" },
      { id: "Saturn",  name: "土星",   symbol: "♄", color: "#334155" },
      { id: "Uranus",  name: "天王星", symbol: "♅", color: "#0284c7" },
      { id: "Neptune", name: "海王星", symbol: "♆", color: "#2563eb" },
      { id: "Pluto",   name: "冥王星", symbol: "♇", color: "#1e293b" }
    ];

    window.addEventListener("DOMContentLoaded", () => {
      const yearSel = document.getElementById("birthYear");
      for (let y = 2035; y >= 1920; y--) {
        const opt = new Option(y, y);
        if (y === 1986) opt.selected = true;
        yearSel.add(opt);
      }
      const monthSel = document.getElementById("birthMonth");
      for (let m = 1; m <= 12; m++) {
        const opt = new Option(m, m);
        if (m === 11) opt.selected = true;
        monthSel.add(opt);
      }
      const daySel = document.getElementById("birthDay");
      for (let d = 1; d <= 31; d++) {
        const opt = new Option(d, d);
        if (d === 17) opt.selected = true;
        daySel.add(opt);
      }
      const hourSel = document.getElementById("birthHour");
      for (let h = 0; h < 24; h++) {
        const v = h.toString().padStart(2, "0");
        const opt = new Option(v, v);
        if (h === 4) opt.selected = true;
        hourSel.add(opt);
      }
      const minSel = document.getElementById("birthMinute");
      for (let min = 0; min < 60; min++) {
        const v = min.toString().padStart(2, "0");
        const opt = new Option(v, v);
        if (min === 21) opt.selected = true;
        minSel.add(opt);
      }
      const prefSel = document.getElementById("prefecture");
      PREFECTURES.forEach((p, idx) => {
        const opt = new Option(p.name, idx);
        if (p.name.includes("岡山県")) opt.selected = true;
        prefSel.add(opt);
      });
    });

    function toggleTimeUnknown(cb) {
      document.getElementById("birthHour").disabled = cb.checked;
      document.getElementById("birthMinute").disabled = cb.checked;
      if (cb.checked) {
        document.getElementById("birthHour").value = "12";
        document.getElementById("birthMinute").value = "00";
      }
    }

    function normDeg(deg) {
      return ((deg % 360) + 360) % 360;
    }

    // 当日春分点（True Equinox of Date）基準の精密視黄経を計算
    function getApparentTropicalLongitude(bodyId, dateObj, observer) {
      const time = Astronomy.MakeTime(dateObj);
      if (bodyId === "Sun") {
        return Astronomy.SunPosition(time).elon;
      }
      if (bodyId === "Moon") {
        return Astronomy.EclipticGeoMoon(time).lon;
      }
      // 惑星: 当日赤道座標 (ofDate = true, aberration = true) から黄道座標へ球面三角変換
      const equ = Astronomy.Equator(Astronomy.Body[bodyId], time, observer, true, true);
      const raRad = equ.ra * 15 * (Math.PI / 180); // RAは時間単位(0-24h)なので×15で度数へ
      const decRad = equ.dec * (Math.PI / 180);

      // J2000からの経過ユリウス世紀 T と黄道傾斜角 ε
      const T = (time.ut) / 36525.0;
      const epsDeg = 23.4392911 - 0.0130042 * T;
      const epsRad = epsDeg * (Math.PI / 180);

      const y = Math.sin(raRad) * Math.cos(epsRad) + Math.tan(decRad) * Math.sin(epsRad);
      const x = Math.cos(raRad);
      let lonDeg = Math.atan2(y, x) * (180 / Math.PI);
      return normDeg(lonDeg);
    }

    // プラシーダス・ハウスカスプ（1〜12室）の精密計算
    function calculatePlacidusHouses(dateObj, latDeg, lngDeg) {
      const time = Astronomy.MakeTime(dateObj);
      const gmstHours = Astronomy.SiderealTime(time); // グリニッジ視恒星時 (0-24h)
      const ramcDeg = normDeg(gmstHours * 15 + lngDeg); // RAMC (度数)
      const ramcRad = ramcDeg * (Math.PI / 180);

      const T = (time.ut) / 36525.0;
      const epsDeg = 23.4392911 - 0.0130042 * T;
      const epsRad = epsDeg * (Math.PI / 180);
      const latRad = latDeg * (Math.PI / 180);

      // MC (第10ハウスカスプ)
      let mcDeg = Math.atan2(Math.sin(ramcRad), Math.cos(ramcRad) * Math.cos(epsRad)) * (180 / Math.PI);
      mcDeg = normDeg(mcDeg);

      // ASC (第1ハウスカスプ)
      let ascDeg = Math.atan2(
        Math.cos(ramcRad),
        -Math.sin(ramcRad) * Math.cos(epsRad) - Math.tan(latRad) * Math.sin(epsRad)
      ) * (180 / Math.PI);
      ascDeg = normDeg(ascDeg);

      // プラシーダス中間カスプ (11, 12, 2, 3ハウス) の反復収束計算
      function calcPlacidusCusp(offsetDeg, f, isNocturnal) {
        let ra = normDeg(ramcDeg + offsetDeg) * (Math.PI / 180);
        for (let i = 0; i < 15; i++) {
          let sinDec = Math.sin(epsRad) * Math.sin(ra);
          let dec = Math.asin(Math.max(-0.9999, Math.min(0.9999, sinDec)));
          let tanProd = Math.tan(latRad) * Math.tan(dec);
          tanProd = Math.max(-0.9999, Math.min(0.9999, tanProd));
          let ad = Math.asin(tanProd); // 昇降差
          let semiArc = isNocturnal ? (Math.PI / 2 - ad) : (Math.PI / 2 + ad);
          let targetRA = isNocturnal
            ? (ramcRad + Math.PI) + f * semiArc
            : ramcRad + f * semiArc;
          ra = targetRA;
        }
        let lon = Math.atan2(Math.sin(ra), Math.cos(ra) * Math.cos(epsRad)) * (180 / Math.PI);
        return normDeg(lon);
      }

      const c10 = mcDeg;
      const c11 = calcPlacidusCusp(30, 1 / 3, false);
      const c12 = calcPlacidusCusp(60, 2 / 3, false);
      const c1  = ascDeg;
      const c2  = calcPlacidusCusp(210, 1 / 3, true);
      const c3  = calcPlacidusCusp(240, 2 / 3, true);

      return [
        c1,
        c2,
        c3,
        normDeg(c10 + 180), // 4室 (IC)
        normDeg(c11 + 180), // 5室
        normDeg(c12 + 180), // 6室
        normDeg(c1 + 180),  // 7室 (DSC)
        normDeg(c2 + 180),  // 8室
        normDeg(c3 + 180),  // 9室
        c10,                // 10室 (MC)
        c11,                // 11室
        c12                 // 12室
      ];
    }

    function formatZodiac(lon) {
      const d = normDeg(lon);
      const signIdx = Math.floor(d / 30);
      const degInSign = Math.floor(d % 30);
      const minInSign = Math.floor(((d % 30) - degInSign) * 60);
      return {
        signIdx,
        signName: ZODIAC[signIdx].name,
        symbol: ZODIAC[signIdx].symbol,
        elem: ZODIAC[signIdx].elem,
        qual: ZODIAC[signIdx].qual,
        deg: degInSign,
        min: minInSign,
        formatted: `${degInSign}°${minInSign.toString().padStart(2, "0")}′`,
        total: d
      };
    }

    // 天体がどのハウスに入っているか判定
    function findHouse(planetLon, cusps) {
      for (let i = 0; i < 12; i++) {
        const start = cusps[i];
        const end = cusps[(i + 1) % 12];
        if (start < end) {
          if (planetLon >= start && planetLon < end) return i + 1;
        } else {
          if (planetLon >= start || planetLon < end) return i + 1;
        }
      }
      return 1;
    }

    function executeHoroscope() {
      if (typeof Astronomy === "undefined") {
        alert("天体計算ライブラリを読み込み中です。2〜3秒待ってから再度押してください。");
        return;
      }

      const y = parseInt(document.getElementById("birthYear").value);
      const m = parseInt(document.getElementById("birthMonth").value);
      const d = parseInt(document.getElementById("birthDay").value);
      const h = parseInt(document.getElementById("birthHour").value);
      const min = parseInt(document.getElementById("birthMinute").value);
      const pref = PREFECTURES[document.getElementById("prefecture").value];
      const timeUnknown = document.getElementById("timeUnknown").checked;

      // 日本時間(JST = UTC+9)をUTC Dateに変換
      const utcDate = new Date(Date.UTC(y, m - 1, d, h - 9, min, 0));
      const utcDateNext = new Date(utcDate.getTime() + 60 * 60 * 1000); // 逆行判定用に1時間後
      const observer = new Astronomy.Observer(pref.lat, pref.lng, 0);

      // ハウスカスプ計算
      const cuspsRaw = calculatePlacidusHouses(utcDate, pref.lat, pref.lng);
      const cusps = cuspsRaw.map((c, idx) => ({
        house: idx + 1,
        ...formatZodiac(c)
      }));

      // 10天体の計算
      const planets = PLANET_LIST.map(pt => {
        const lonNow = getApparentTropicalLongitude(pt.id, utcDate, observer);
        const lonNext = getApparentTropicalLongitude(pt.id, utcDateNext, observer);
        let diff = lonNext - lonNow;
        if (diff > 180) diff -= 360;
        if (diff < -180) diff += 360;
        const isRetro = (pt.id !== "Sun" && pt.id !== "Moon" && diff < 0);

        const z = formatZodiac(lonNow);
        const houseNum = timeUnknown ? "-" : `${findHouse(lonNow, cuspsRaw)}ハウス`;

        return {
          ...pt,
          ...z,
          isRetro,
          retroMark: isRetro ? "R" : "",
          houseNum
        };
      });

      // メジャーアスペクト計算
      const aspects = [];
      const aspectRules = [
        { name: "Conjunction (合 / 0°)", angle: 0, orb: 7, color: "#2563eb" },
        { name: "Opposition (衝 / 180°)", angle: 180, orb: 7, color: "#dc2626" },
        { name: "Trine (三分 / 120°)", angle: 120, orb: 6, color: "#16a34a" },
        { name: "Square (四分 / 90°)", angle: 90, orb: 6, color: "#ea580c" },
        { name: "Sextile (六分 / 60°)", angle: 60, orb: 4.5, color: "#0891b2" }
      ];

      for (let i = 0; i < planets.length; i++) {
        for (let j = i + 1; j < planets.length; j++) {
          let diff = Math.abs(planets[i].total - planets[j].total);
          if (diff > 180) diff = 360 - diff;
          for (const r of aspectRules) {
            const orbVal = Math.abs(diff - r.angle);
            if (orbVal <= r.orb) {
              aspects.push({
                p1: planets[i].name,
                p2: planets[j].name,
                type: r.name,
                orb: orbVal.toFixed(1),
                color: r.color
              });
              break;
            }
          }
        }
      }

      // 4区分（エレメント）・3区分（クオリティ）集計
      const elems = { "火": [], "地": [], "風": [], "水": [] };
      const quals = { "活動": [], "固定": [], "柔軟": [] };
      planets.forEach(p => {
        elems[p.elem].push(`${p.symbol}${p.name}`);
        quals[p.qual].push(`${p.symbol}${p.name}`);
      });

      document.getElementById("elementBox").innerHTML = `
        <strong>4区分（エレメント）＆ 3区分（クオリティ）分布</strong>
        <div class="elem-grid">
          <div>🔥 <strong>火 (${elems["火"].length}):</strong> ${elems["火"].join(" ") || "なし"}</div>
          <div>🌱 <strong>地 (${elems["地"].length}):</strong> ${elems["地"].join(" ") || "なし"}</div>
          <div>🍃 <strong>風 (${elems["風"].length}):</strong> ${elems["風"].join(" ") || "なし"}</div>
          <div>💧 <strong>水 (${elems["水"].length}):</strong> ${elems["水"].join(" ") || "なし"}</div>
        </div>
      `;

      // テーブル描画
      document.getElementById("planetTableBody").innerHTML = planets.map(p => `
        <tr>
          <td><strong>${p.symbol} ${p.name}</strong></td>
          <td>${p.symbol_z || ZODIAC[p.signIdx].symbol} ${p.signName}</td>
          <td>${p.formatted}${p.retroMark}</td>
          <td>${p.houseNum}</td>
        </tr>
      `).join("");

      document.getElementById("houseTableBody").innerHTML = cusps.map(c => `
        <tr>
          <td><strong>${c.house}ハウス${c.house === 1 ? " (ASC)" : c.house === 10 ? " (MC)" : ""}</strong></td>
          <td>${c.symbol} ${c.signName}</td>
          <td>${c.formatted}</td>
        </tr>
      `).join("");

      // チャート描画
      drawHoroscopeWheel(planets, cuspsRaw, aspects, timeUnknown);

      // プロンプト生成
      buildAiPrompt(y, m, d, h, min, pref.name, timeUnknown, planets, cusps, aspects, elems, quals);

      document.getElementById("resultWrapper").style.display = "block";
      document.getElementById("resultWrapper").scrollIntoView({ behavior: "smooth" });
    }

    function drawHoroscopeWheel(planets, cuspsRaw, aspects, timeUnknown) {
      const canvas = document.getElementById("horoCanvas");
      const ctx = canvas.getContext("2d");
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const rOuter = 265;
      const rZodiac = 215;
      const rInner = 145;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 基準角度: ASC（1ハウスカスプ）を左（9時方向 = 180度）に固定
      const baseDeg = timeUnknown ? 0 : cuspsRaw[0];
      const toRad = (lon) => ((180 - (lon - baseDeg)) * Math.PI) / 180;

      // 円枠の描画
      ctx.strokeStyle = "#94a3b8";
      ctx.lineWidth = 1.5;
      [rOuter, rZodiac, rInner].forEach(r => {
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.stroke();
      });

      // 12サインの境界とシンボル
      ZODIAC.forEach((z, idx) => {
        const startLon = idx * 30;
        const rad = toRad(startLon);
        ctx.beginPath();
        ctx.moveTo(cx + rZodiac * Math.cos(rad), cy + rZodiac * Math.sin(rad));
        ctx.lineTo(cx + rOuter * Math.cos(rad), cy + rOuter * Math.sin(rad));
        ctx.strokeStyle = "#cbd5e1";
        ctx.stroke();

        const midRad = toRad(startLon + 15);
        const symR = (rOuter + rZodiac) / 2;
        ctx.font = "bold 16px sans-serif";
        ctx.fillStyle = "#1e293b";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(`${z.symbol}`, cx + symR * Math.cos(midRad), cy + symR * Math.sin(midRad));
      });

      // ハウスカスプ線
      if (!timeUnknown) {
        cuspsRaw.forEach((cLon, idx) => {
          const rad = toRad(cLon);
          const isAxis = (idx === 0 || idx === 3 || idx === 6 || idx === 9);
          ctx.beginPath();
          ctx.moveTo(cx + rInner * Math.cos(rad), cy + rInner * Math.sin(rad));
          ctx.lineTo(cx + rZodiac * Math.cos(rad), cy + rZodiac * Math.sin(rad));
          ctx.strokeStyle = isAxis ? "#1e3a8a" : "#cbd5e1";
          ctx.lineWidth = isAxis ? 2 : 1;
          ctx.stroke();

          // ハウス番号
          const nextLon = cuspsRaw[(idx + 1) % 12];
          let span = nextLon - cLon;
          if (span < 0) span += 360;
          const midRad = toRad(cLon + span / 2);
          ctx.font = "11px sans-serif";
          ctx.fillStyle = "#64748b";
          ctx.fillText(`${idx + 1}`, cx + (rInner + 14) * Math.cos(midRad), cy + (rInner + 14) * Math.sin(midRad));
        });
      }

      // アスペクト線
      aspects.forEach(asp => {
        const p1 = planets.find(p => p.name === asp.p1);
        const p2 = planets.find(p => p.name === asp.p2);
        if (!p1 || !p2) return;
        const r1 = toRad(p1.total);
        const r2 = toRad(p2.total);
        ctx.strokeStyle = asp.color;
        ctx.lineWidth = 1.1;
        ctx.beginPath();
        ctx.moveTo(cx + rInner * Math.cos(r1), cy + rInner * Math.sin(r1));
        ctx.lineTo(cx + rInner * Math.cos(r2), cy + rInner * Math.sin(r2));
        ctx.stroke();
      });

      // 天体プロット（重なり回避機能付き）
      const plotted = [...planets].sort((a, b) => a.total - b.total);
      plotted.forEach((p, idx) => {
        const rad = toRad(p.total);
        // 近い天体同士は半径を少しずらして文字被りを防ぐ
        const offset = (idx % 2 === 0) ? 0 : -18;
        const pRadius = (rZodiac + rInner) / 2 + 8 + offset;

        // 内円上の正確な度数ドット
        ctx.beginPath();
        ctx.arc(cx + rInner * Math.cos(rad), cy + rInner * Math.sin(rad), 3, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();

        const x = cx + pRadius * Math.cos(rad);
        const y = cy + pRadius * Math.sin(rad);
        ctx.font = "bold 15px sans-serif";
        ctx.fillStyle = p.color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(`${p.symbol}${p.retroMark}`, x, y);
      });
    }

    function buildAiPrompt(y, m, d, h, min, prefName, timeUnknown, planets, cusps, aspects, elems, quals) {
      const timeStr = timeUnknown ? "不明（12:00仮定）" : `${h.toString().padStart(2, "0")}:${min.toString().padStart(2, "0")}`;
      const pLines = planets.map(p => `- ${p.name} (${p.symbol}): ${p.signName} ${p.formatted}${p.retroMark} [${p.houseNum}]`).join("\n");
      const hLines = timeUnknown ? "- 出生時間不明のためハウス除外" : cusps.map(c => `- 第${c.house}ハウス${c.house===1?"(ASC)":c.house===10?"(MC)":""}: ${c.signName} ${c.formatted}`).join("\n");
      const aLines = aspects.map(a => `- ${a.p1} × ${a.p2}: ${a.type} (オーブ ${a.orb}°)`).join("\n");

      const prompt = `# 指示
以下の精密天体計算データ（トロピカル・プラシーダス方式）に基づき、対象者のネイタルチャートを西洋占星術の専門的かつ構造的な視点から徹底解析してください。

# 解析ルール（重要）
- 誰にでも当てはまる曖昧な慰めや抽象的な一般論（バーナム効果）は一切排除してください。
- サイン・度数・逆行（R）・ハウス配置・タイトなアスペクトが引き起こす「思考の癖・葛藤構造・職人的な技術適性・生存戦略」を論理的かつ具体的に言語化してください。

# 出生データ
- 生年月日: ${y}年${m}月${d}日
- 出生時間: ${timeStr}
- 出生地: ${prefName}

# 4区分・3区分バランス
- 火: ${elems["火"].length} / 地: ${elems["地"].length} / 風: ${elems["風"].length} / 水: ${elems["水"].length}
- 活動: ${quals["活動"].length} / 固定: ${quals["固定"].length} / 柔軟: ${quals["柔軟"].length}

# 天体配置（サイン・度数・逆行・ハウス）
${pLines}

# ハウス・カスプ（プラシーダス）
${hLines}

# 主要アスペクト
${aLines}

# 出力構成
1. チャート構造の核（ASC・太陽・月の関係性、オーバーロードしているサインやハウスの特徴）
2. 職能・適性・独自の武器（独立・職人適性、知的生産や造形・技術面での強み）
3. 内的葛藤とエネルギーの昇華法（ハードアスペクトや逆行天体がもたらす緊張と、その具体的な突破口）
4. 現実的なライフスタイル・環境構築の指針`;

      document.getElementById("promptText").value = prompt;
    }

    function copyPrompt() {
      const txt = document.getElementById("promptText");
      txt.select();
      navigator.clipboard.writeText(txt.value);
      alert("精密AIプロンプトをコピーしました！");
    }
  </script>
